<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Révision</title>
<style>body{font-family:sans-serif;max-width:800px;margin:auto;padding:16px}div{border-bottom:1px solid #ccc;padding:10px 0}b{color:green}button{font-size:18px;padding:10px;position:sticky;top:0}</style>
<button onclick=go()>🔀 Mélanger et changer les données</button><main id=m></main>
<script>
const E=Math.exp,L=Math.log,mx=x=>Math.max(x,0);
const R=(a,b,d=2)=>+(a+Math.random()*(b-a)).toFixed(d),I=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const f=x=>String(x).replace('.',',');
const n=x=>`<br><i>[Answer ${x}, no unit, and no thousand separators; use "." as decimal separator.]</i>`;
const A4=n('with a least 4 decimals'),B4=n('with at least 4 decimals'),PL=n('with a least two decimals and a minus sign "-" for a negative P&L'),D2=n('with a least two decimals'),DL=n('to the nearest dollar with a minus sign "-" for a negative P&L'),DC=n('to the nearest dollar with a minus sign "-" for a cost');
const Q=[
()=>{let a=R(1,3),b=R(3,5),c=R(5,7);return[`The 6-month LIBOR interest rate is ${f(a)}% per annum, the 1-year LIBOR interest rate is ${f(b)}% per annum, and the 18-month LIBOR interest rate is ${f(c)}% per annum (all with semi-annual compounding). What is the forward interest rate with semi-annual compounding for the time period between months 12 and 18?`+A4,((1+c/200)**3/(1+b/200)**2-1)*2]},
()=>{let n=I(10,60),p=R(95,99.5);return[`In December 2022, Delta Airlines was planning to borrow $${n} million starting March 2023, for three months at the 3-month LIBOR underlying rate. At that time, the March 2023 Eurodollar futures contract was quoted at ${f(p)}. What interest rate could be locked in December 2022 by using the March 2023 Eurodollar futures contract?`+B4,(100-p)/100]},
()=>{let r=R(1,8);return[`What rate of interest with semi-annual compounding is equivalent to ${f(r)}% per annum with annual compounding?`+A4,2*((1+r/100)**.5-1)]},
()=>{let a=R(1,3),b=R(3,6),c=R(6,8);return[`The 3-month LIBOR interest rate is ${f(a)}% per annum, the 6-month LIBOR interest rate is ${f(b)}% per annum, and the 9-month LIBOR interest rate is ${f(c)}% per annum (all with continuous compounding). What is the forward interest rate with continuous compounding for the time period between months 6 and 9?`+A4,(c*.75-b*.5)/.25/100]},
()=>{let k1=I(42,48),k2=I(36,41),c=R(1,2,1),p=R(1,2,1),s=R(35,52);return[`A trader buys a call option with a strike price of $${k1} and a put option with a strike price of $${k2}. Both options have the same maturity. The call costs $${f(c)} and the put costs $${f(p)}. What is the trader's final P&L if the stock price is at $${f(s)} on the expiration date?`+PL,mx(s-k1)+mx(k2-s)-c-p]},
()=>{let r=R(1,5,1),s=R(40,70),s0=I(40,60);return[`A one-year forward contract on a non-dividend-paying stock is entered into when the stock price is $${s0} and the risk-free rate of interest is ${f(r)}% per annum with continuous compounding. Six months later, the price of the stock is $${f(s)} and the risk-free interest rate is still ${f(r)}%. What is the new forward price?`+D2,s*E(r/100*.5)]},
()=>{let n=I(10,50),p=R(97,99.5),r=R(1,4,1);return[`In December 2023, Boeing decides to borrow $${n} million for three months at the overnight SOFR underlying rate (with compounded interests). At that time, the 3-month March 2024 SOFR futures contract is quoted at ${f(p)}. Recall that the face value of a SOFR futures contract is $1,000,000 and the basis point value is $25. To hedge interest rate risk, Boeing takes a position in 3-month March 2024 SOFR futures. If the realized 3-month SOFR average turns out to be ${f(r)}% per annum on March 20th, 2024, what is the company’s Profit & Loss (in dollars) on the hedging futures position?`+DL,Math.round((p-(100-r))*2500*n)]},
()=>{let n=I(10,50),p=R(97,99.5),l=R(1,3);return[`In December 2022, Uniterd Airlines was planning to borrow $${n} million starting March 2023 for three months at the 3-month LIBOR underlying rate. At that time, the March 2023 Eurodollar futures contract was quoted at ${f(p)}. Recall that the face value of a Eurodollar futures contract was $1,000,000 and the basis point value was $25. To hedge interest rate risk, United Airlines took a position in Eurodollar futures, and the actual 3-month LIBOR interest rate turned out to be ${f(l)}% at the end of March 2023. What was the final settlement price on the March 2023 Eurodollar futures contract?`+n('with at least 2 decimals'),100-l]},
()=>{let r=R(1,8);return[`What rate of interest with semi-annual compounding is equivalent to ${f(r)}% per annum with continuous compounding?`+A4,2*(E(r/200)-1)]},
()=>{let s=R(.78,.9,4),g=R(.5,3),u=R(1,4);return[`The current GBP/USD exchange rate is ${f(s)} pound per dollar. The 6-month GBP interest rate is ${f(g)}% per annum with continuous compounding. The 6-month USD interest rate is ${f(u)}% per annum with continuous compounding. What is the 6-month forward GBP/USD exchange rate?`+A4,s*E((g-u)/200)]},
()=>{let k=R(30,50,1),c=R(1,4,1),s=R(25,70,1);return[`An investor sells a European call option on a share with a strike price of ${f(k)}$ for ${f(c)}$. At the expiration date, the stock price is $${f(s)}. What is the investor's P&L?`+PL,c-mx(s-k)]},
()=>{let a=R(1,3),b=R(3,5),c=R(5,7);return[`The 3-month LIBOR interest rate is ${f(a)}% per annum, the 6-month LIBOR interest rate is ${f(b)}% per annum, and the 9-month LIBOR interest rate is ${f(c)}% per annum (all with quarterly compounding). What is the forward interest rate with quarterly compounding for the time period between months 6 and 9?`+A4,((1+c/400)**3/(1+b/400)**2-1)*4]},
()=>{let n=I(10,50),p=R(97,99.9),r=R(1,4);return[`In December 2023, Boeing decides to borrow $${n} million for three months at the overnight SOFR underlying rate (with compounded interests). On December 20th, 2023, the 3-month March 2024 SOFR futures contract is quoted at ${f(p)}. Recall that the face value of a SOFR futures contract is $1,000,000 and the basis point value is $25. To hedge interest rate risk, Boeing takes a position in 3-month March 2024 SOFR futures. If the realized 3-month SOFR average turns out to be ${f(r)}% per annum on March 20th, 2024, what is the effective cost (in dollars) for the company of borrowing in the market on December 20th, 2023?`+DC,-Math.round(n*1e6*(100-p)/400)]},
()=>{let s0=R(.7,.8),rd=R(2,5),rf=R(1,4),s1=R(.68,.8);return[`A US company is exporting goods to Canada. It has entered into a 1-year currency forward contract to exchange 1 million Canadian dollars against US dollars. At contract inception, the spot exchange rate was ${f(s0)} USD/CAD, the domestic interest rate was ${f(rd)}% per annum with continuous compounding, and the foreign interest rate was ${f(rf)}% per annum with continuous compounding. Six months later, the risk-free interest rates remain unchanged but the new spot exchange rate is ${f(s1)} USD/CAD. What is the marked-to-market value (in US dollars) of the company's forward position?`+n('to the nearest dollar and with a minus sign "-" for a negative value'),Math.round((s0*E((rd-rf)/100)-s1*E((rd-rf)/200))*1e6*E(-rd/200))]},
()=>{let d1=R(.5,1.5,1),d2=R(.5,1.5,1),s=I(80,120),r=R(2,5);return[`A stock is expected to pay one cash dividend of $${f(d1)} per share in 1 month and another cash dividend of $${f(d2)} per share in 7 months. The stock price is currently $${s}, and the risk-free rate of interest is ${f(r)}% per annum with continuous compounding for all maturities. What is the 1-year forward price (in dollars)?`+D2,(s-d1*E(-r/1200)-d2*E(-7*r/1200))*E(r/100)]},
()=>{let s=R(35,50),r=R(1,5,1),t=R(35,55);return[`A one-year forward contract on a non-dividend-paying stock is entered into when the stock price is $${f(s)} and the risk-free rate of interest is ${f(r)}% per annum with continuous compounding. At maturity, the price of the stock is $${f(t)}. What is the P&L on the long forward position?`+n('with at least two decimals and a minus sign "-" for a negative P&L'),t-s*E(r/100)]},
()=>{let a=R(1.5,2.5,1),b=R(2,3,1),c=R(2.5,3.5,1),x=I(5,20),y=I(5,20);return[`To calculate the final settlement price of the 3-month December 2023 SOFR futures contract, an analyst has collected the overnight SOFR rates published over the 91-day period running from September 20th, 2023 (included) to December 20th, 2023 (excluded). She has observed an overnight SOFR equal to ${f(a)}% per annum over ${x} days, ${f(b)}% per annum over ${y} days, and ${f(c)}% per annum over the remaining observations. What is the realized 3-month SOFR average by December 20th, 2023, expressed with quarterly compounding?`+B4,((1+a/36000)**x*(1+b/36000)**y*(1+c/36000)**(91-x-y)-1)*360/91]},
()=>{let k=I(10,50),p=R(1,4,1),s=R(5,60);return[`An investor sells a European put option on a share with a strike price of ${k}$ for ${f(p)}$. At the expiration date, the stock price is $${f(s)}. What is the investor's P&L?`+PL,p-mx(k-s)]},
()=>{let r=R(1,8);return[`What rate of interest with continuous compounding is equivalent to ${f(r)}% per annum with monthly compounding?`+A4,12*L(1+r/1200)]},
()=>{let n=I(10,50),p=R(97,99.5),l=R(1,3,1);return[`In December 2022, Boeing was planning to borrow $${n} million starting March 2023 for three months at the 3-month LIBOR underlying rate. At that time, the March 2023 Eurodollar futures contract was quoted at ${f(p)}. Recall that the face value of a Eurodollar futures contract was $1,000,000 and the basis point value was $25. To hedge interest rate risk, Boeing took a position in Eurodollar futures, and the actual 3-month LIBOR interest rate turned out to be ${f(l)}% at the end of March 2023. What was the company’s Profit & Loss (in dollars) on the hedging futures position?`+DL,Math.round((p-(100-l))*2500*n)]},
()=>{let a=R(1,3),b=R(3,7);return[`The 3-month LIBOR interest rate is ${f(a)}% per annum and the 6-month LIBOR interest rate is ${f(b)}% per annum, both with continuous compounding. What is the forward interest rate with continuous compounding for the time period between months 3 and 6?`+A4,(2*b-a)/100]},
()=>{let s=R(.8,.85,4),g=R(1,2,1),fw=R(.8,.84,4);return[`The current GBP/USD exchange rate is ${f(s)} pound per dollar. The 6-month forward exchange rate is ${f(fw)} pound per dollar. The 6-month GBP interest rate is ${f(g)}% per annum continuously compounded. What is the 6-month USD interest rate per annum with continuous compounding?`+A4,g/100-2*L(fw/s)]},
()=>{let k=R(25,30,1),c=R(2,5,1),s=R(26,30),p=R(4,7,1),r=2;return[`A European call that expires in six months and has a strike price of $${f(k)} is worth $${f(c)}. The underlying stock price is $${f(s)}, and no dividend payments are expected during the next six months. All risk-free rates are at ${r}% per annum with continuous compounding. The price of the put option with the same strike and same maturity is $${f(p)} in the market. What is the net profit that can be generated from this arbitrage opportunity?`+D2,Math.abs(c+k*E(-r/200)-p-s)*E(r/200)]},
()=>{let s=R(35,50),r=R(1,4,1),q=I(10,50);return[`A one-year forward contract on a non-dividend-paying stock is entered into when the stock price is $${f(s)}, the risk-free rate of interest is ${f(r)}% per annum with continuous compounding, and the repo rate on the stock is ${q} basis points per annum. What should be the contractual forward price (in dollars)?`+D2,s*E(r/100-q/1e4)]},
()=>{let n=I(10,50),p=R(95,99.5);return[`In December 2022, a company was planning to borrow $${n} million starting March 2023 for three months at the 3-month LIBOR underlying rate. At that time, the March 2023 Eurodollar futures contract was quoted at ${f(p)}. Recall that the face value of a Eurodollar futures contract was $1,000,000 and the basis point value was $25. To hedge interest rate risk, the company needed to take a position in Eurodollar futures. What was the number of Eurodollar futures contracts to buy or sell?`+n('with a minus sign "-" for a short position'),-n]},
()=>{let p=R(1,4,1),k=I(30,60),s=R(25,65);return[`An investor buys for $${f(p)} a European put option on a share with a strike price at $${k}. At the expiration date, the stock price is $${f(s)}. What is the investor's P&L (in dollars)?`+PL,mx(k-s)-p]},
()=>{let k=I(20,40),c=R(2,8,1),s=R(15,40),r=R(1,6,1);return[`A European call that expires in six months and has a strike price of $${k} is worth $${f(c)}. The underlying stock price is $${f(s)}, and no dividend payments are expected during the next six months. All risk-free rates are at ${f(r)}% per annum with continuous compounding. What is the theoretical price in dollars of the six-month European put option with the same strike price of $${k}?`+D2,c+k*E(-r/200)-s]},
()=>{let r=R(1,6,1);return[`A deposit account pays ${f(r)}% per annum with continuous compounding, but interest is actually paid quarterly. How much interest will be paid each quarter on a $100,000 deposit?`+D2,1e5*(E(r/400)-1)]},
()=>{let c=R(1,4,1),k=I(10,40),s=R(5,50);return[`An investor buys for $${f(c)} a European call option on a share with a strike price at $${k}. At the expiration date, the stock price is $${f(s)}. What is the investor's P&L (in dollars)?`+PL,mx(s-k)-c]},
()=>{let n=I(10,50),p=R(97,99.5),l=R(1,3);return[`In December 2022, Boeing was planning to borrow $${n} million starting March 2023 for three months at the 3-month LIBOR underlying rate. At that time, the March 2023 Eurodollar futures contract was quoted at ${f(p)}. Recall that the face value of a Eurodollar futures contract was $1,000,000 and the basis point value was $25. To hedge interest rate risk, Boeing took a position in Eurodollar futures, and the actual 3-month LIBOR interest rate turned out to be ${f(l)}% at the end of March 2023. What was the effective cost (in dollars) for the company of borrowing in the market at that date?`+DC,-Math.round(n*1e6*(100-p)/400)]}];
function go(){m.innerHTML=Q.map(g=>g()).sort(()=>Math.random()-.5).map((q,i)=>`<div>${i+1}. ${q[0]}<br><b>${f(+q[1].toFixed(4))}</b></div>`).join('')}go()
</script>
