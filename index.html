<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Révision</title>
<style>body{font-family:sans-serif;max-width:800px;margin:auto;padding:16px}div{border-bottom:1px solid #ccc;padding:10px 0}b{color:green}button{font-size:18px;padding:10px;position:sticky;top:0}</style>
<button onclick=go()>🔀 Mélanger et changer les données</button><main id=m></main>
<script>
const E=Math.exp,L=Math.log,mx=x=>Math.max(x,0);
const R=(a,b,d=2)=>+(a+Math.random()*(b-a)).toFixed(d),I=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const f=x=>String(x).replace('.',',');
const Q=[
()=>{let a=R(1,3),b=R(3,5),c=R(5,7);return[`The 6-month LIBOR rate is ${f(a)}%, the 1-year ${f(b)}%, the 18-month ${f(c)}% (semi-annual compounding). Forward rate (semi-annual) between months 12 and 18?`,((1+c/200)**3/(1+b/200)**2-1)*2]},
()=>{let p=R(95,99.5);return[`Borrow 3 months at 3-month LIBOR starting March. March Eurodollar futures quoted at ${f(p)}. What rate can be locked in?`,(100-p)/100]},
()=>{let r=R(1,8);return[`What rate with semi-annual compounding is equivalent to ${f(r)}% with annual compounding?`,2*((1+r/100)**.5-1)]},
()=>{let a=R(1,3),b=R(3,6),c=R(6,8);return[`3-month LIBOR ${f(a)}%, 6-month ${f(b)}%, 9-month ${f(c)}% (continuous). Forward rate (continuous) between months 6 and 9?`,(c*.75-b*.5)/.25/100]},
()=>{let k1=I(42,48),k2=I(36,41),c=R(1,2,1),p=R(1,2,1),s=R(35,52);return[`Buy a call K=$${k1} for $${f(c)} and a put K=$${k2} for $${f(p)}. Stock at $${f(s)} at expiry. Final P&L?`,mx(s-k1)+mx(k2-s)-c-p]},
()=>{let r=R(1,5,1),s=R(40,70);return[`1-year forward on non-dividend stock, r=${f(r)}% continuous. Six months later stock is $${f(s)}. New forward price?`,s*E(r/100*.5)]},
()=>{let n=I(10,50),p=R(97,99.5),r=R(1,4,1);return[`Boeing borrows $${n}M for 3 months at SOFR. March SOFR futures at ${f(p)} (BPV $25). Realized 3-month SOFR = ${f(r)}%. P&L on the hedging futures position ($)?`,Math.round((p-(100-r))*2500*n)]},
()=>{let p=R(97,99.5),l=R(1,3);return[`March Eurodollar futures quoted at ${f(p)}. Actual 3-month LIBOR at end of March = ${f(l)}%. Final settlement price?`,100-l]},
()=>{let r=R(1,8);return[`What rate with semi-annual compounding is equivalent to ${f(r)}% with continuous compounding?`,2*(E(r/200)-1)]},
()=>{let s=R(.78,.9,4),g=R(.5,3),u=R(1,4);return[`GBP/USD spot = ${f(s)} pound per dollar. 6-month GBP rate ${f(g)}%, USD rate ${f(u)}% (continuous). 6-month forward GBP/USD?`,s*E((g-u)/200)]},
()=>{let k=R(30,50,1),c=R(1,4,1),s=R(25,70,1);return[`An investor sells a European call K=$${f(k)} for $${f(c)}. Stock at expiry $${f(s)}. P&L?`,c-mx(s-k)]},
()=>{let a=R(1,3),b=R(3,5),c=R(5,7);return[`3-month LIBOR ${f(a)}%, 6-month ${f(b)}%, 9-month ${f(c)}% (quarterly compounding). Forward rate (quarterly) between months 6 and 9?`,((1+c/400)**3/(1+b/400)**2-1)*4]},
()=>{let n=I(10,50),p=R(97,99.9),r=R(1,4);return[`Boeing borrows $${n}M for 3 months at SOFR. March SOFR futures at ${f(p)} (BPV $25). Realized SOFR = ${f(r)}%. Effective borrowing cost ($, negative)?`,-Math.round(n*1e6*(100-p)/400)]},
()=>{let s0=R(.7,.8),rd=R(2,5),rf=R(1,4),s1=R(.68,.8);return[`US exporter: 1-year forward to sell 1M CAD. At inception spot ${f(s0)} USD/CAD, rd=${f(rd)}%, rf=${f(rf)}% (continuous). Six months later spot = ${f(s1)}. Marked-to-market value ($)?`,Math.round((s0*E((rd-rf)/100)-s1*E((rd-rf)/200))*1e6*E(-rd/200))]},
()=>{let d1=R(.5,1.5,1),d2=R(.5,1.5,1),s=I(80,120),r=R(2,5);return[`Dividends $${f(d1)} in 1 month and $${f(d2)} in 7 months. Stock $${s}, r=${f(r)}% continuous. 1-year forward price?`,(s-d1*E(-r/1200)-d2*E(-7*r/1200))*E(r/100)]},
()=>{let s=R(35,50),r=R(1,5,1),t=R(35,55);return[`1-year forward on non-dividend stock at $${f(s)}, r=${f(r)}% continuous. At maturity stock = $${f(t)}. P&L on long forward?`,t-s*E(r/100)]},
()=>{let a=R(1.5,2.5,1),b=R(2,3,1),c=R(2.5,3.5,1),x=I(5,20),y=I(5,20);return[`Over 91 days, overnight SOFR = ${f(a)}% for ${x} days, ${f(b)}% for ${y} days, ${f(c)}% for the rest. Realized 3-month SOFR (quarterly compounding)?`,((1+a/36000)**x*(1+b/36000)**y*(1+c/36000)**(91-x-y)-1)*360/91]},
()=>{let k=I(10,50),p=R(1,4,1),s=R(5,60);return[`An investor sells a European put K=$${k} for $${f(p)}. Stock at expiry $${f(s)}. P&L?`,p-mx(k-s)]},
()=>{let r=R(1,8);return[`What rate with continuous compounding is equivalent to ${f(r)}% with monthly compounding?`,12*L(1+r/1200)]},
()=>{let n=I(10,50),p=R(97,99.5),l=R(1,3,1);return[`Boeing borrows $${n}M at 3-month LIBOR. March Eurodollar futures at ${f(p)} (BPV $25). Actual LIBOR = ${f(l)}%. P&L on hedging futures ($)?`,Math.round((p-(100-l))*2500*n)]},
()=>{let a=R(1,3),b=R(3,7);return[`3-month LIBOR ${f(a)}%, 6-month ${f(b)}% (continuous). Forward rate (continuous) between months 3 and 6?`,(2*b-a)/100]},
()=>{let s=R(.8,.85,4),g=R(1,2,1),fw=R(.8,.84,4);return[`GBP/USD spot ${f(s)}, 6-month forward ${f(fw)} pound per dollar. GBP rate ${f(g)}% continuous. 6-month USD rate (continuous)?`,g/100-2*L(fw/s)]},
()=>{let k=R(25,30,1),c=R(2,5,1),s=R(26,30),p=R(4,7,1),r=2;return[`6-month European call K=$${f(k)} worth $${f(c)}, stock $${f(s)}, r=${r}% continuous, put same K at $${f(p)}. Net arbitrage profit (at maturity)?`,Math.abs(c+k*E(-r/200)-p-s)*E(r/200)]},
()=>{let s=R(35,50),r=R(1,4,1),q=I(10,50);return[`1-year forward on stock $${f(s)}, r=${f(r)}% continuous, repo rate ${q} bp. Forward price?`,s*E(r/100-q/1e4)]},
()=>{let n=I(10,50),p=R(95,99.5);return[`Company borrows $${n}M at 3-month LIBOR. Eurodollar futures at ${f(p)}. Number of contracts (negative = short)?`,-n]},
()=>{let p=R(1,4,1),k=I(30,60),s=R(25,65);return[`Buy a European put for $${f(p)}, K=$${k}. Stock at expiry $${f(s)}. P&L?`,mx(k-s)-p]},
()=>{let k=I(20,40),c=R(2,8,1),s=R(15,40),r=R(1,6,1);return[`6-month European call K=$${k} worth $${f(c)}, stock $${f(s)}, r=${f(r)}% continuous. Theoretical put price?`,c+k*E(-r/200)-s]},
()=>{let r=R(1,6,1);return[`Deposit pays ${f(r)}% continuous, paid quarterly. Interest per quarter on $100000?`,1e5*(E(r/400)-1)]},
()=>{let c=R(1,4,1),k=I(10,40),s=R(5,50);return[`Buy a European call for $${f(c)}, K=$${k}. Stock at expiry $${f(s)}. P&L?`,mx(s-k)-c]},
()=>{let n=I(10,50),p=R(97,99.5),l=R(1,3);return[`Boeing borrows $${n}M at 3-month LIBOR. March Eurodollar futures at ${f(p)} (BPV $25). Actual LIBOR = ${f(l)}%. Effective borrowing cost ($, negative)?`,-Math.round(n*1e6*(100-p)/400)]}];
function go(){m.innerHTML=Q.map(g=>g()).sort(()=>Math.random()-.5).map((q,i)=>`<div>${i+1}. ${q[0]}<br><b>${f(+q[1].toFixed(4))}</b></div>`).join('')}go()
</script>
